<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Order Parfum App</title>
    
    <link rel="manifest" href="data:application/manifest+json;base64,ewogICJuYW1lIjogIk9yZGVyIFBhcmZ1bSIsCiAgInNob3J0X25hbWUiOiAiUGFyZnVtIiwKICAic3RhcnRfdXJsIjogIi4iLAogICJkaXNwbGF5IjogInN0YW5kYWxvbmUiLAogICJiYWNrZ3JvdW5kX2NvbG9yIjogIiNmOGZhZmMiLAogICJ0aGVtZV9jb2xvciI6ICIjMjU2M2ViIiwKICAiaWNvbnMiOiBbCiAgICB7CiAgICAgICJzcmMiOiAiaHR0cHM6Ly9wbGFjZWhvbGQuY28vMTkyLzI1NjNlYi9mZmZmZmY/dGV4dD1QJmZvbnQ9cGxheWZhaXIiLAogICAgICAic2l6ZXMiOiAiMTkyeDE5MiIsCiAgICAgICJ0eXBlIjogImltYWdlL3BuZyIKICAgIH0sCiAgICB7CiAgICAgICJzcmMiOiAiaHR0cHM6Ly9wbGFjZWhvbGQuY28vNTEyLzI1NjNlYi9mZmZmZmY/dGV4dD1QJmZvbnQ9cGxheWZhaXIiLAogICAgICAic2l6ZXMiOiAiNTEyeDUxMiIsCiAgICAgICJ0eXBlIjogImltYWdlL3BuZyIKICAgIH1cbiAgXQp9">

    <!-- Tailwind CSS & Font Awesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(226, 232, 240, 0.8); }
        .order-done { background-color: #f0fdf4 !important; opacity: 0.7; }
        .order-done .text-content { text-decoration: line-through; }
        .spinner { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        @media all and (display-mode: standalone) {
            body { padding-top: env(safe-area-inset-top); }
            header { margin-top: 10px; }
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-5xl mx-auto">
        <header class="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <h1 class="text-3xl font-bold text-slate-800 flex items-center gap-3">
                    <span class="text-blue-600"><i class="fas fa-box-open"></i></span>
                    Order Parfum 📦
                </h1>
                <p class="text-slate-500 mt-1 text-sm md:text-base">Aplikasi pengelola pesanan tersinkronisasi</p>
            </div>
            <div class="flex flex-wrap gap-2">
                <button id="installBtn" class="hidden bg-blue-600 text-white px-4 py-2 rounded-xl hover:bg-blue-700 transition flex items-center gap-2 text-sm font-bold shadow-lg shadow-blue-100">
                    <i class="fas fa-download"></i> Install App
                </button>
                <button onclick="fetchDataDariSheet()" class="bg-blue-50 text-blue-600 px-4 py-2 rounded-xl hover:bg-blue-100 transition flex items-center gap-2 text-sm font-bold">
                    <i class="fas fa-sync-alt" id="syncIcon"></i> Sinkron Data
                </button>
                <button onclick="exportData()" class="bg-white border border-slate-200 text-slate-600 px-4 py-2 rounded-xl hover:bg-slate-50 transition flex items-center gap-2 text-sm font-medium shadow-sm">
                    <i class="fas fa-download"></i> Backup
                </button>
                <input type="file" id="fileImport" class="hidden" onchange="importData(event)">
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Form Input -->
            <div class="lg:col-span-1">
                <div class="glass-card p-6 rounded-2xl shadow-sm sticky top-8">
                    <h2 class="text-lg font-semibold text-slate-800 mb-4 flex items-center gap-2">
                        <i class="fas fa-plus-circle text-blue-500"></i> Pesanan Baru
                    </h2>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Nama Pembeli</label>
                            <input type="text" id="nama" placeholder="Budi Santoso" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Nomor WA</label>
                            <input type="text" id="wa" placeholder="0812xxxx" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Produk</label>
                            <input type="text" id="produk" placeholder="Parfum Blue 50ml" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Tanggal</label>
                                <input type="date" id="tgl" class="w-full px-3 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Kurir</label>
                                <select id="ekspedisi" class="w-full px-3 py-3 rounded-xl border border-slate-200 bg-white outline-none text-sm">
                                    <option value="jne">JNE</option>
                                    <option value="jnt">J&T</option>
                                    <option value="sicepat">SiCepat</option>
                                    <option value="shopee">Shopee</option>
                                </select>
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Nomor Resi</label>
                            <input type="text" id="resi" placeholder="Masukkan resi..." class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <button id="btnSimpan" onclick="tambahOrder()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl transition shadow-lg shadow-blue-200 flex items-center justify-center gap-2">
                            <i class="fas fa-paper-plane"></i> Simpan & Kirim
                        </button>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-2">
                <div class="glass-card rounded-2xl shadow-sm overflow-hidden">
                    <div class="px-6 py-4 border-b flex justify-between items-center bg-white/50">
                        <h2 class="font-bold text-slate-800">Daftar Pengiriman</h2>
                        <span id="badgeCount" class="bg-blue-100 text-blue-600 text-xs font-bold px-3 py-1 rounded-full">0 Order</span>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left" id="tabelOrder">
                            <thead class="bg-slate-50 text-slate-500 text-[10px] uppercase tracking-wider">
                                <tr>
                                    <th class="px-6 py-4">Pembeli</th>
                                    <th class="px-6 py-4">Produk</th>
                                    <th class="px-6 py-4">Resi</th>
                                    <th class="px-6 py-4 text-right">Aksi</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100"></tbody>
                        </table>
                    </div>
                    <div id="emptyState" class="p-12 text-center hidden text-slate-400">
                        <i class="fas fa-folder-open text-4xl mb-2"></i><p>Belum ada data</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- UI Notifikasi -->
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 translate-y-20 opacity-0 bg-slate-900 text-white px-6 py-4 rounded-2xl transition-all duration-300 z-50 flex items-center gap-3 shadow-2xl">
        <i id="toastIcon" class="fas fa-check-circle text-green-400"></i>
        <span id="toastMsg" class="text-sm font-medium">Berhasil</span>
    </div>

    <script>
        // MASUKKAN URL GOOGLE SCRIPT KAMU DI SINI
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwMcMDUHa45P3EKmMp0g6D5Ef9WJm1gviqDq_jjEvevO9pDoNm0rF_jFKtfX55Sz9emvw/exec';

        const linkEkspedisi = {
            jne: r => `https://cekresi.com/?noresi=${r}`,
            jnt: r => `https://jet.co.id/track?awb=${r}`,
            sicepat: r => `https://sicepat.com/checkAwb?awb=${r}`,
            shopee: r => `https://spx.co.id/track?waybill=${r}`
        };

        let dataOrder = JSON.parse(localStorage.getItem('dataParfum') || '[]');

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            document.getElementById('toastIcon').className = isError ? 'fas fa-exclamation-circle text-red-400' : 'fas fa-check-circle text-green-400';
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 3000);
        }

        // Fungsi Sinkronisasi: Ambil data terbaru dari Google Sheets
        async function fetchDataDariSheet() {
            const syncIcon = document.getElementById('syncIcon');
            syncIcon.classList.add('spinner');
            
            try {
                const response = await fetch(SCRIPT_URL + '?action=read');
                const result = await response.json();
                if (result && Array.isArray(result)) {
                    dataOrder = result;
                    localStorage.setItem('dataParfum', JSON.stringify(dataOrder));
                    renderTabel();
                    showToast('Data berhasil disinkronkan!');
                }
            } catch (error) {
                console.error(error);
                showToast('Gagal ambil data dari Sheets', true);
            } finally {
                syncIcon.classList.remove('spinner');
            }
        }

        function renderTabel() {
            const tbody = document.querySelector('#tabelOrder tbody');
            const emptyState = document.getElementById('emptyState');
            tbody.innerHTML = '';
            document.getElementById('badgeCount').innerText = `${dataOrder.length} Order`;

            if (dataOrder.length === 0) emptyState.classList.remove('hidden');
            else {
                emptyState.classList.add('hidden');
                dataOrder.forEach((o, i) => {
                    const rowClass = o.selesai ? 'order-done' : '';
                    tbody.innerHTML += `
                        <tr class="${rowClass} hover:bg-slate-50 transition-colors">
                            <td class="px-6 py-4">
                                <div class="font-bold text-slate-800 text-sm text-content">${o.nama}</div>
                                <div class="text-[11px] text-blue-500 font-medium tracking-tight">${o.wa}</div>
                            </td>
                            <td class="px-6 py-4">
                                <div class="text-xs text-slate-600 text-content">${o.produk}</div>
                                <div class="text-[9px] text-slate-400 font-bold uppercase">${o.tgl}</div>
                            </td>
                            <td class="px-6 py-4">
                                <div class="text-[10px] font-black uppercase text-slate-500">${o.ekspedisi}</div>
                                <div class="text-[11px] text-slate-400 font-mono">${o.resi}</div>
                            </td>
                            <td class="px-6 py-4 text-right">
                                <div class="flex justify-end gap-1 md:gap-2">
                                    <a href="${linkEkspedisi[o.ekspedisi](o.resi)}" target="_blank" class="w-8 h-8 flex items-center justify-center text-blue-600 bg-blue-50 rounded-lg hover:bg-blue-100 transition" title="Cek Resi"><i class="fas fa-truck-fast text-xs"></i></a>
                                    <button onclick="toggleSelesai(${i})" class="w-8 h-8 flex items-center justify-center text-green-600 bg-green-50 rounded-lg hover:bg-green-100 transition" title="Selesai"><i class="fas fa-check-double text-xs"></i></button>
                                    <button onclick="hapusOrder(${i})" class="w-8 h-8 flex items-center justify-center text-red-400 bg-red-50 rounded-lg hover:bg-red-100 transition" title="Hapus"><i class="fas fa-trash text-xs"></i></button>
                                </div>
                            </td>
                        </tr>`;
                });
            }
            localStorage.setItem('dataParfum', JSON.stringify(dataOrder));
        }

        async function tambahOrder() {
            const btn = document.getElementById('btnSimpan');
            const order = {
                nama: document.getElementById('nama').value,
                wa: document.getElementById('wa').value,
                produk: document.getElementById('produk').value,
                tgl: document.getElementById('tgl').value,
                ekspedisi: document.getElementById('ekspedisi').value,
                resi: document.getElementById('resi').value,
                selesai: false
            };

            if (!order.resi || !order.nama) return showToast('Isi Nama & Resi bro!', true);

            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-circle-notch spinner"></i> Mengirim...`;

            try {
                // Mengirim ke Google Script
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    cache: 'no-cache',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(order)
                });
                
                // Tambahkan ke data lokal
                dataOrder.unshift(order);
                renderTabel();
                showToast('Berhasil Simpan & Kirim!');
                ['nama', 'wa', 'produk', 'resi'].forEach(id => document.getElementById(id).value = '');
            } catch (error) {
                dataOrder.unshift(order);
                renderTabel();
                showToast('Hanya simpan di browser (Gagal Sheets)', true);
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fas fa-paper-plane"></i> Simpan & Kirim`;
            }
        }

        function toggleSelesai(i) { dataOrder[i].selesai = !dataOrder[i].selesai; renderTabel(); }
        
        function hapusOrder(i) { 
            const row = dataOrder[i];
            const confirmBox = document.createElement('div');
            confirmBox.innerHTML = `
                <div class="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4">
                    <div class="bg-white rounded-2xl p-6 w-full max-w-xs text-center shadow-2xl">
                        <h3 class="font-bold text-lg mb-2">Hapus Order?</h3>
                        <p class="text-slate-500 text-sm mb-6 text-content">Yakin hapus pesanan ${row.nama}?</p>
                        <div class="flex gap-3">
                            <button id="noHapus" class="flex-1 py-2 bg-slate-100 rounded-xl font-bold">Batal</button>
                            <button id="yesHapus" class="flex-1 py-2 bg-red-500 text-white rounded-xl font-bold">Hapus</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.appendChild(confirmBox);
            document.getElementById('noHapus').onclick = () => confirmBox.remove();
            document.getElementById('yesHapus').onclick = () => {
                dataOrder.splice(i, 1);
                renderTabel();
                confirmBox.remove();
                showToast('Terhapus!');
            };
        }
        
        function exportData() {
            const blob = new Blob([JSON.stringify(dataOrder, null, 2)], {type: 'application/json'});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'backup-order.json'; a.click();
        }

        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => { 
                try {
                    dataOrder = JSON.parse(reader.result); 
                    renderTabel(); 
                    showToast('Impor Berhasil!'); 
                } catch(e) {
                    showToast('File tidak valid!', true);
                }
            };
            reader.readAsText(file);
        }

        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.classList.remove('hidden');
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installBtn.classList.add('hidden');
                }
                deferredPrompt = null;
            }
        });

        if ('serviceWorker' in navigator) {
            const swCode = `self.addEventListener('fetch', function(event) {});`;
            const blob = new Blob([swCode], {type: 'text/javascript'});
            const url = URL.createObjectURL(blob);
            navigator.serviceWorker.register(url);
        }

        document.getElementById('tgl').valueAsDate = new Date();
        renderTabel();

        // Otomatis sinkron saat pertama kali dibuka jika ada koneksi
        fetchDataDariSheet();
    </script>
</body>
</html>
